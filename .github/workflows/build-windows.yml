name: Build Windows app

# Builds the real Windows artifact. PyInstaller cannot cross-compile, so this
# is the only place a genuine .exe is produced - development happens on Linux
# and the packaged output is verified here.

on:
  push:
    branches: [claude/trading-terminal-app-design-m6xsst]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 0.1.0)'
        required: false
        default: ''
      release:
        description: 'Publish a GitHub Release for this version'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unit tests
        run: |
          python tests/test_insider.py
          python tests/test_core.py
          python tests/test_app.py
          python tests/test_desk.py

  build:
    name: Build Windows exe + installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF -replace '^refs/tags/v','' }
            else { $v = (Get-Content src/argus/VERSION -Raw).Trim() + "+build.${{ github.run_number }}" }
          }
          $base = ($v -split '\+')[0]
          "version=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "base=$base"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v (base $base)"

      - name: Stamp version into the bundle and the file resource
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $b = "${{ steps.ver.outputs.base }}"
          Set-Content -Path src/argus/VERSION -Value $v -NoNewline
          $p = ($b -split '\.') + @('0','0','0')
          $tuple = "($($p[0]), $($p[1]), $($p[2]), 0)"
          $vi = Get-Content packaging/version_info.txt -Raw
          $vi = $vi -replace 'filevers=\(.*?\)', "filevers=$tuple"
          $vi = $vi -replace 'prodvers=\(.*?\)', "prodvers=$tuple"
          $vi = $vi -replace "StringStruct\('FileVersion',\s*'.*?'\)",    "StringStruct('FileVersion', '$v')"
          $vi = $vi -replace "StringStruct\('ProductVersion',\s*'.*?'\)", "StringStruct('ProductVersion', '$v')"
          Set-Content -Path packaging/version_info.txt -Value $vi

      # Release policy, declarative and idempotent: the version in
      # src/argus/VERSION is the release version. The first build that sees no
      # tag for it publishes one; every later build finds the tag and skips.
      # Bumping VERSION is therefore how a release is cut, which works from a
      # plain branch push - tag creation and workflow dispatch both need
      # credentials an interactive session may not hold, and CI does.
      - name: Decide whether to publish a release
        id: rel
        shell: bash
        run: |
          base="${{ steps.ver.outputs.base }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested a release for v$base."
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag push - publishing v$base."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$base already exists - not re-publishing."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No tag v$base yet - publishing it from this commit."
          fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.11.1
          pip install -r requirements.txt

      - name: Regenerate the icon
        run: python packaging/make_icon.py

      - name: Build with PyInstaller
        run: pyinstaller packaging/argus.spec --noconfirm --clean

      - name: Smoke-test the frozen app
        shell: pwsh
        run: |
          $exe = "dist/Argus/Argus.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no exe" }
          $size = (Get-ChildItem -Recurse dist/Argus | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Bundle size: {0:N1} MB" -f ($size/1MB))
          # Bundled data files must actually be present, or the app starts and
          # then 500s on its first request - which a "did it launch?" check misses.
          foreach ($f in @('_internal/argus/app/ui.html','_internal/argus/VERSION')) {
            if (-not (Test-Path "dist/Argus/$f")) { throw "missing bundled asset: $f" }
          }
          # Ask the frozen app to prove it actually serves. "Still running" is
          # not "working": v0.1.0 passed a liveness-only check and was broken on
          # arrival, because a mislocated bundled asset left the process up
          # while every request died in the handler.
          $report = "$env:RUNNER_TEMP\argus-selfcheck.txt"
          $proc = Start-Process -FilePath $exe -ArgumentList "--check","--check-out",$report -PassThru -Wait
          if (Test-Path $report) { Get-Content $report | Write-Host }
          if ($proc.ExitCode -ne 0) { throw "self-check failed (exit $($proc.ExitCode))" }

          # And that it stays up when launched normally.
          $win = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($win.HasExited) { throw "app exited immediately with code $($win.ExitCode)" }
          Stop-Process -Id $win.Id -Force
          Write-Host "Smoke test passed"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.base }}" packaging/argus.iss
          Get-ChildItem dist/installer

      - uses: actions/upload-artifact@v4
        with:
          name: Argus-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/Argus/
            dist/installer/*.exe
          retention-days: 30

      # Two routes to a release. A pushed v* tag publishes automatically; a
      # manual run with release=true creates the tag itself at this commit.
      # The second exists because tag creation needs credentials the CI job has
      # and an interactive session may not.
      - name: Publish the release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.base }}
          name: Argus ${{ steps.ver.outputs.base }}
          files: dist/installer/*.exe
          generate_release_notes: true
          body: |
            **Windows installer — no admin rights, no Python, no command line.**

            Download `Argus-${{ steps.ver.outputs.base }}-setup.exe` below and run it.

            On first launch it asks for one thing: a name and an email address.
            The SEC refuses anonymous traffic to EDGAR outright, so this is
            required rather than optional. Nothing else needs configuring.

            **This build is not code-signed**, so Windows SmartScreen will warn
            on first run — choose *More info* then *Run anyway*. The in-app
            update check is deliberately check-only for the same reason: with no
            signature to verify against, an auto-updater would be a remote code
            execution path rather than a feature.

            ### What is in it
            - **Insiders** — ranked SEC Form 4 feed. Decodes filings rather than
              listing them; roughly 70-80% of rows are payroll and score zero,
              with the reason attached. Conviction scoring shows every factor.
            - **Desk** — bias board for FX and metals. A lean, a strength, and
              every input behind them, with conflict reported separately.
              Session state, rollover warnings, and a DST-correct release calendar.
            - **Trade** — position sizing from your actual stop, spread as a
              percentage of risk, and whether that stop sits inside normal volatility.

            Information only. There is no order path anywhere in this build.
